<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전력 계통도 편집기 - Power System Single-Line Diagram</title>

    <!-- JointJS CSS -->
    <link rel="stylesheet" href="./static/css/joint.min.css?v=20260903_03" />
    <!-- SLD Pure CSS Theme -->
    <link rel="stylesheet" href="./static/css/sld_styles.css?v=20260903_03" />

    <style>
      html,body { height:100%; margin:0; }
      #sld-paper-container { width:100%; height:100vh; background:#f8fafc; }
    </style>
  </head>
  <body>
    <div id="sld-paper-container"></div>

    <!-- Vendor scripts (order matters) -->
    <script src="./static/js/vendor/jquery.min.js"></script>
    <script src="./static/js/vendor/backbone-min.js"></script>
    <script src="./static/js/vendor/joint.min.js"></script>

    <!-- Core / helper scripts used by the editor -->
    <script src="./static/js/core/SLDSerializer.js"></script>
    <script src="./static/js/core/HistoryManager.js"></script>
    <script src="./static/js/core/ClipboardManager.js"></script>
    <script src="./static/js/topologyTracker.js"></script>
    <script src="./static/js/sldSymbols.js"></script>

    <!-- Main editor implementation (must load after dependencies) -->
    <script src="./static/js/sldEditor.js"></script>

    <script>
      // Load default schema (if available) then initialize editor.
      (function() {
        const initEditor = () => {
          try {
            // Use a consistent diagram id that the code expects
            window.sldEditor = new SLDEditor('sld-paper-container', {
              diagramId: 'default-154kv-substation',
              gridSize: 10,
            });
          } catch (err) {
            console.error('Failed to initialize SLDEditor:', err);
          }
        };

        // If a bundled default_schema.json exists, load it into window.DEFAULT_SLD_SCHEMA
        fetch('./static/data/default_schema.json')
          .then(r => {
            if (!r.ok) throw new Error('no default schema');
            return r.json();
          })
          .then(json => {
            window.DEFAULT_SLD_SCHEMA = json;
            initEditor();
          })
          .catch(() => {
            // Fallback: try to rely on any inline DEFAULT_SLD_SCHEMA variable or just init
            initEditor();
          });
      })();
    </script>
  </body>
</html>
