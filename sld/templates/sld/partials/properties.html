<aside class="sld-sidebar-right">
  <div class="sld-prop-tabs">
    <button class="prop-tab-btn active" data-tab="general">일반</button>
    <button class="prop-tab-btn" data-tab="style">스타일</button>
    <button class="prop-tab-btn" data-tab="data">데이터</button>
  </div>

  <div class="sld-prop-content">
    <!-- Tab 1: 일반 속성 -->
    <div class="tab-pane active" id="tab-general">
      <div class="sld-form-group">
        <label class="sld-form-label">이름</label>
        <input
          type="text"
          class="sld-input"
          id="prop-name"
          placeholder="설비명 입력 (예: ACB)"
        />
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">설명</label>
        <input
          type="text"
          class="sld-input"
          id="prop-desc"
          placeholder="설비 설명 (예: 주 배전 차단기)"
        />
      </div>

      <div class="sld-form-group" id="group-prop-state">
        <label class="sld-form-label">설비 상태 (Equipment State)</label>
        <div class="sld-state-toggle-group">
          <button
            type="button"
            class="state-toggle-btn btn-state-live"
            data-state="LIVE"
          >
            <span class="state-dot dot-live"></span>
            <span>활선 (Live)</span>
          </button>
          <button
            type="button"
            class="state-toggle-btn btn-state-dead"
            data-state="DEAD"
          >
            <span class="state-dot dot-dead"></span>
            <span>사선 (Dead)</span>
          </button>
          <button
            type="button"
            class="state-toggle-btn btn-state-grounded"
            data-state="GROUNDED"
          >
            <span class="state-dot dot-grounded"></span>
            <span>접지 (Ground)</span>
          </button>
        </div>
        <select class="sld-select" id="prop-state" style="display: none">
          <option value="LIVE">활선 (Live)</option>
          <option value="DEAD">사선 (Dead)</option>
          <option value="GROUNDED">접지 (Grounded)</option>
        </select>
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">정격 전압</label>
        <div class="sld-input-row">
          <input
            type="number"
            step="any"
            class="sld-input"
            id="prop-voltage"
            placeholder="0.4"
          />
          <select class="sld-select" style="width: 70px">
            <option>kV</option>
            <option>V</option>
          </select>
        </div>
      </div>

      <div
        class="sld-form-group"
        id="group-prop-connection"
        style="display: none"
      >
        <label class="sld-form-label">결선 방식 (Vector Group)</label>
        <select class="sld-select" id="prop-connection" style="width: 100%">
          <option value="Δ-Y">Δ - Y (델타-와이)</option>
          <option value="Y-Δ">Y - Δ (와이-델타)</option>
          <option value="Δ-Δ">Δ - Δ (델타-델타)</option>
          <option value="Y-Y">Y - Y (와이-와이)</option>
          <option value="Yn-Δ">Yn - Δ (와이접지-델타)</option>
          <option value="Δ-Yn">Δ - Yn (델타-와이접지)</option>
          <option value="Y-Y-Δ">Y - Y - Δ (3권선)</option>
          <option value="Y-Δ-Δ">Y - Δ - Δ (3권선)</option>
        </select>
      </div>

      <div
        class="sld-form-group"
        id="group-prop-capacity"
        style="display: none"
      >
        <label class="sld-form-label">정격 용량 (Capacity)</label>
        <input
          type="text"
          class="sld-input"
          id="prop-capacity"
          placeholder="예: 20MVA, 1000kVA"
        />
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">정격 전류</label>
        <div class="sld-input-row">
          <input
            type="number"
            step="any"
            class="sld-input"
            id="prop-current"
            placeholder="3200"
          />
          <select class="sld-select" style="width: 70px">
            <option>A</option>
            <option>kA</option>
          </select>
        </div>
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">극수</label>
        <select class="sld-select" id="prop-poles" style="width: 100%">
          <option value="1P">1P</option>
          <option value="2P">2P</option>
          <option value="3P" selected>3P</option>
          <option value="4P">4P</option>
        </select>
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">설치 위치</label>
        <select class="sld-select" id="prop-location" style="width: 100%">
          <option value="154kV 수전단">154kV 수전단</option>
          <option value="22.9kV 모선">22.9kV 모선</option>
          <option value="0.4kV 모선 (A)" selected>0.4kV 모선 (A)</option>
          <option value="0.4kV 모선 (B)">0.4kV 모선 (B)</option>
          <option value="0.4kV 모선 (C)">0.4kV 모선 (C)</option>
          <option value="UPS 배전반">UPS 배전반</option>
        </select>
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">메모</label>
        <textarea
          class="sld-textarea"
          id="prop-memo"
          placeholder="특이사항 및 메모 입력"
        ></textarea>
      </div>

      <div style="margin-top: 24px">
        <button type="button" class="sld-btn-danger" id="btn-delete-element">
          <span>🗑️</span>
          <span>삭제</span>
        </button>
      </div>
    </div>

    <!-- Tab 2: 스타일 속성 -->
    <div class="tab-pane" id="tab-style" style="display: none">
      <div class="sld-form-group">
        <label class="sld-form-label">심볼 색상</label>
        <div class="sld-input-row" style="align-items: center">
          <input
            type="color"
            id="prop-symbol-color"
            value="#377DFF"
            style="
              width: 40px;
              height: 32px;
              padding: 0;
              border: none;
              cursor: pointer;
            "
          />
          <div style="display: flex; gap: 6px">
            <div
              class="palette-color-dot prop-color-picker"
              data-color="#7A3E9D"
              style="background: #7a3e9d"
            ></div>
            <div
              class="palette-color-dot prop-color-picker"
              data-color="#9C27B0"
              style="background: #9c27b0"
            ></div>
            <div
              class="palette-color-dot prop-color-picker"
              data-color="#2B6CB0"
              style="background: #2b6cb0"
            ></div>
            <div
              class="palette-color-dot prop-color-picker"
              data-color="#2E7D32"
              style="background: #2e7d32"
            ></div>
            <div
              class="palette-color-dot prop-color-picker"
              data-color="#E65100"
              style="background: #e65100"
            ></div>
          </div>
        </div>
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">선 색상</label>
        <input
          type="color"
          id="prop-line-color"
          value="#377DFF"
          style="
            width: 40px;
            height: 32px;
            padding: 0;
            border: none;
            cursor: pointer;
          "
        />
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">선 두께 (px)</label>
        <input
          type="number"
          class="sld-input"
          id="prop-line-width"
          value="2"
          min="1"
          max="10"
        />
      </div>

      <div class="sld-form-group">
        <label class="sld-form-label">라벨 표시</label>
        <label
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            cursor: pointer;
          "
        >
          <input type="checkbox" id="prop-show-label" checked />
          <span>캔버스에 명칭 표시</span>
        </label>
      </div>
    </div>

    <!-- Tab 3: 데이터 & HTMX 텔레메트리 -->
    <div class="tab-pane" id="tab-data" style="display: none">
      <div
        id="telemetry-container"
        hx-get="/api/sld/{{ active_diagram.diagram_id }}/telemetry/"
        hx-trigger="load, every 10s"
        hx-swap="innerHTML"
      >
        {% include "sld/partials/telemetry_panel.html" %}
      </div>
    </div>
  </div>
</aside>
