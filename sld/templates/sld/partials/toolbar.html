<div class="sld-toolbar">
  <div class="sld-tool-group">
    <!-- Selection Tool -->
    <button class="tool-btn active" data-tool="select" title="선택 도구 (V)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M4 0l16 12.279-6.951 1.17 4.325 8.817-3.596 1.734-4.35-8.879-5.428 5.428z"
        />
      </svg>
    </button>
    <!-- Lasso Tool -->
    <button class="tool-btn" data-tool="lasso" title="영역 선택 (L)">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M7 22a5 5 0 0 1-2-4c0-3.8 4-5.2 6-6s4-3.2 4-6a5 5 0 0 0-10 0c0 4 3 6 5 8"
        />
        <circle cx="17" cy="18" r="3" />
      </svg>
    </button>
    <div class="sld-tool-divider"></div>

    <!-- Wire Tool -->
    <button class="tool-btn" data-tool="wire" title="직교 배선 도구 (W)">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M4 4h8v8h8" />
      </svg>
    </button>
    <!-- Pen Tool -->
    <button class="tool-btn" data-tool="pen" title="펜 그리기 (P)">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M12 19l7-7 3 3-7 7-3-3z" />
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
      </svg>
    </button>
    <!-- Text Tool -->
    <button class="tool-btn" data-tool="text" title="텍스트 라벨 (T)">
      <span style="font-size: 14px; font-weight: bold">T</span>
    </button>
    <!-- Group Box Tool -->
    <button class="tool-btn" data-tool="group" title="영역 그룹 박스 (G)">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-dasharray="3 3"
      >
        <rect x="3" y="3" width="18" height="18" rx="2" />
      </svg>
    </button>
    <!-- Rotate 90deg Tool -->
    <button
      class="tool-btn"
      id="btn-rotate-toolbar"
      title="심볼 90° 회전 (R)"
      style="color: #4f46e5"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
      </svg>
    </button>
    <!-- Batch Rename Tool -->
    <button
      class="tool-btn"
      id="btn-batch-rename-toolbar"
      title="설비 이름 일괄 변경 / 치환 (Ctrl+H / F2)"
      style="color: #2563eb"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
        />
        <line x1="7" y1="7" x2="7.01" y2="7" />
      </svg>
    </button>
    <!-- Delete Tool -->
    <button
      class="tool-btn"
      id="btn-delete-toolbar"
      title="선택 항목 삭제 (Delete / Backspace)"
      style="color: #ef4444"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polyline points="3 6 5 6 21 6" />
        <path
          d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
        />
      </svg>
    </button>
    <div class="sld-tool-divider"></div>

    <!-- Color Quick Palette -->
    <div style="display: flex; align-items: center; gap: 6px; margin-left: 4px">
      <div
        class="palette-color-dot"
        style="background: #e53935"
        title="154kV 초고압 적색"
      ></div>
      <div
        class="palette-color-dot"
        style="background: #9c27b0"
        title="22.9kV 특고압 자주"
      ></div>
      <div
        class="palette-color-dot"
        style="background: #1e88e5"
        title="6.6kV 고압 청색"
      ></div>
      <div
        class="palette-color-dot"
        style="background: #16a34a"
        title="0.4kV 저압 녹색"
      ></div>
      <div
        class="palette-color-dot"
        style="background: #eab308"
        title="0.22kV 상용 황색"
      ></div>
      <div
        class="palette-color-dot"
        style="background: #ea580c"
        title="DC 주황"
      ></div>
    </div>
  </div>

  <!-- Zoom & Viewport Controls -->
  <div class="sld-tool-group">
    <button class="tool-btn" id="btn-zoom-out" title="축소 (-)">
      <span>—</span>
    </button>
    <button class="tool-btn" id="btn-zoom-in" title="확대 (+)">
      <span>+</span>
    </button>
    <button
      class="tool-btn"
      id="btn-zoom-fit"
      title="화면 맞춤 (Fit to Screen)"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
        />
      </svg>
    </button>
    <div class="sld-tool-divider"></div>
    <button
      class="tool-btn"
      id="btn-close-toolbar-popup"
      title="툴바 닫기 (T 또는 Esc)"
      style="color: #94a3b8; font-weight: bold; font-size: 13px;"
    >
      ✕
    </button>
  </div>
</div>
