<aside class="sld-sidebar-left">
  <div class="sld-sidebar-header">심볼 라이브러리</div>
  <div class="sld-search-box">
    <input
      type="text"
      class="sld-search-input"
      id="symbol-search-input"
      placeholder="검색"
    />
  </div>

  <div class="sld-palette-scroll" id="symbol-palette-scroll">
    <!-- 1. 수전 설비 -->
    <div class="palette-category-block">
      <div class="sld-category-title">
        <span>▾</span>
        <span>수전 설비</span>
      </div>
      <div class="sld-palette-grid">
        <div
          class="palette-item"
          data-symbol-type="TRANSMISSION_TOWER"
          title="154kV 송전선로 수전 철탑"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#7A3E9D"
            stroke-width="1.5"
          >
            <path d="M12 2L4 22h16L12 2zm0 6l5 12H7l5-12zM2 14h20M5 18h14" />
          </svg>
          <span>송전선로</span>
        </div>
        <div class="palette-item" data-symbol-type="TR_2W" title="2권선 변압기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2E7D32"
            stroke-width="1.5"
          >
            <circle cx="12" cy="8" r="5" />
            <circle cx="12" cy="16" r="5" />
          </svg>
          <span>변압기</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="CB_GCB"
          title="154kV 가스차단기 (GCB)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#7A3E9D"
            stroke-width="1.5"
          >
            <rect x="6" y="4" width="12" height="16" rx="2" />
            <path d="M12 4v4M12 16v4M8 12h8" />
          </svg>
          <span>차단기</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="DS"
          title="154kV 단로기 (DS)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#7A3E9D"
            stroke-width="1.5"
          >
            <path d="M12 3v5M12 16v5M12 8l4 6M12 14h2" />
            <circle cx="12" cy="8" r="1.5" fill="#7A3E9D" />
            <circle cx="12" cy="16" r="1.5" fill="#7A3E9D" />
          </svg>
          <span>단로기</span>
        </div>
      </div>
    </div>

    <!-- 2. 보호 / 차단 설비 -->
    <div class="palette-category-block">
      <div class="sld-category-title">
        <span>▾</span>
        <span>보호 / 차단 설비</span>
      </div>
      <div class="sld-palette-grid">
        <div
          class="palette-item"
          data-symbol-type="CB_ACB"
          title="기중차단기 (ACB)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#377DFF"
            stroke-width="1.5"
          >
            <rect x="5" y="4" width="14" height="16" rx="2" />
            <text
              x="12"
              y="14"
              text-anchor="middle"
              font-size="6.5"
              font-weight="bold"
              fill="#377DFF"
            >
              ACB
            </text>
          </svg>
          <span>ACB</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="CB_VCB"
          title="진공차단기 (VCB)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#9C27B0"
            stroke-width="1.5"
          >
            <rect x="5" y="4" width="14" height="16" rx="2" />
            <text
              x="12"
              y="14"
              text-anchor="middle"
              font-size="6.5"
              font-weight="bold"
              fill="#9C27B0"
            >
              VCB
            </text>
          </svg>
          <span>VCB</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="CB_MCCB"
          title="배선용차단기 (MCCB)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2B6CB0"
            stroke-width="1.5"
          >
            <rect x="6" y="4" width="12" height="16" rx="1.5" />
            <path d="M9 8h6M9 16h6M12 8v8" />
          </svg>
          <span>MCCB</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="FUSE"
          title="파워 퓨즈 (PF)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#E65100"
            stroke-width="1.5"
          >
            <path d="M12 3v4M12 17v4" />
            <rect x="7" y="7" width="10" height="10" rx="1" />
            <path d="M12 7v10" />
          </svg>
          <span>퓨즈</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="RELAY"
          title="보호계전기 (OCR)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2E7D32"
            stroke-width="1.5"
          >
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <text
              x="12"
              y="14"
              text-anchor="middle"
              font-size="6"
              font-weight="bold"
              fill="#2E7D32"
            >
              51
            </text>
          </svg>
          <span>계전기</span>
        </div>
        <div class="palette-item" data-symbol-type="CT" title="변류기 (CT)">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#00838F"
            stroke-width="1.5"
          >
            <circle cx="12" cy="12" r="6" />
            <path d="M6 12h12M12 3v3M12 18v3" />
          </svg>
          <span>CT</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="PT"
          title="계기용변압기 (PT)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#00838F"
            stroke-width="1.5"
          >
            <circle cx="12" cy="9" r="4.5" />
            <circle cx="12" cy="15" r="4.5" />
          </svg>
          <span>PT</span>
        </div>
        <div class="palette-item" data-symbol-type="LA" title="피뢰기 (LA)">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#7A3E9D"
            stroke-width="1.5"
          >
            <path d="M12 2v6M9 8h6l-3 4h4l-5 6h4l-3 4" />
          </svg>
          <span>피뢰기</span>
        </div>
      </div>
    </div>

    <!-- 3. 배전 설비 -->
    <div class="palette-category-block">
      <div class="sld-category-title">
        <span>▾</span>
        <span>배전 설비</span>
      </div>
      <div class="sld-palette-grid">
        <div
          class="palette-item"
          data-symbol-type="BUSBAR"
          title="전력 모선 (Busbar)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#9C27B0"
            stroke-width="1.5"
          >
            <rect x="2" y="10" width="20" height="4" rx="1" fill="#9C27B0" />
            <circle cx="6" cy="12" r="1.5" fill="#fff" />
            <circle cx="12" cy="12" r="1.5" fill="#fff" />
            <circle cx="18" cy="12" r="1.5" fill="#fff" />
          </svg>
          <span>모선</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="SWITCHGEAR"
          title="배전반 (Switchgear)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2E7D32"
            stroke-width="1.5"
          >
            <rect x="4" y="3" width="16" height="18" rx="2" />
            <line x1="4" y1="10" x2="20" y2="10" />
            <line x1="4" y1="16" x2="20" y2="16" />
          </svg>
          <span>배전반</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="PANELBOARD"
          title="분전반 (Panelboard)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2B6CB0"
            stroke-width="1.5"
          >
            <rect x="5" y="4" width="14" height="16" rx="1.5" />
            <rect x="8" y="7" width="8" height="10" stroke-width="1" />
          </svg>
          <span>분전반</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="MOTOR"
          title="전동기 (Motor)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#377DFF"
            stroke-width="1.5"
          >
            <circle cx="12" cy="12" r="8" />
            <text
              x="12"
              y="15"
              text-anchor="middle"
              font-size="9"
              font-weight="bold"
              fill="#377DFF"
            >
              M
            </text>
          </svg>
          <span>모터</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="LOAD"
          title="일반 부하 (Load)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#374151"
            stroke-width="1.5"
          >
            <rect x="5" y="7" width="14" height="10" rx="1" />
            <path d="M12 2v5M12 17v5" />
          </svg>
          <span>부하</span>
        </div>
      </div>
    </div>

    <!-- 4. 전원 설비 -->
    <div class="palette-category-block">
      <div class="sld-category-title">
        <span>▾</span>
        <span>전원 설비</span>
      </div>
      <div class="sld-palette-grid">
        <div
          class="palette-item"
          data-symbol-type="UPS"
          title="무정전 전원장치 (UPS)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#00838F"
            stroke-width="1.5"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <line x1="3" y1="19" x2="21" y2="5" stroke-width="1" />
            <text x="14" y="15" font-size="6" font-weight="bold" fill="#00838F">
              =
            </text>
          </svg>
          <span>UPS</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="RECTIFIER"
          title="정류기 / 충전기"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2E7D32"
            stroke-width="1.5"
          >
            <rect x="4" y="5" width="16" height="14" rx="2" />
            <line x1="4" y1="19" x2="20" y2="5" stroke-width="1" />
          </svg>
          <span>정류기</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="BATTERY"
          title="축전지 (Battery Bank)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#00838F"
            stroke-width="1.5"
          >
            <rect x="4" y="6" width="16" height="12" rx="2" />
            <rect x="7" y="4" width="3" height="2" fill="#00838F" />
            <rect x="14" y="4" width="3" height="2" fill="#00838F" />
          </svg>
          <span>배터리</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="GENERATOR"
          title="비상 발전기 (Generator)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#E65100"
            stroke-width="1.5"
          >
            <circle cx="12" cy="12" r="8" />
            <text
              x="12"
              y="15"
              text-anchor="middle"
              font-size="9"
              font-weight="bold"
              fill="#E65100"
            >
              G
            </text>
          </svg>
          <span>발전기</span>
        </div>
      </div>
    </div>

    <!-- 5. 기타 -->
    <div class="palette-category-block">
      <div class="sld-category-title">
        <span>▾</span>
        <span>기타</span>
      </div>
      <div class="sld-palette-grid">
        <div
          class="palette-item"
          data-symbol-type="GROUND"
          title="접지 (Earth)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2E7D32"
            stroke-width="1.5"
          >
            <path d="M12 4v8M6 12h12M8 15h8M10 18h4" />
          </svg>
          <span>접지</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="JUNCTION"
          title="접속점 (Junction Node)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#377DFF"
            stroke-width="1.5"
          >
            <circle cx="12" cy="12" r="4" fill="#377DFF" />
          </svg>
          <span>연결점</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="TEXT_LABEL"
          title="텍스트 주석"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1e293b"
            stroke-width="1.8"
          >
            <path d="M5 5h14M12 5v14M8 19h8" />
          </svg>
          <span>텍스트</span>
        </div>
        <div
          class="palette-item"
          data-symbol-type="GROUP_BOX"
          title="영역 점선 박스"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#377DFF"
            stroke-width="1.5"
            stroke-dasharray="3 2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
          </svg>
          <span>그룹박스</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Minimap Box -->
  <div class="sld-minimap-container">
    <div class="sld-minimap-header">미니맵</div>
    <div
      class="sld-minimap-box"
      id="minimap-box-container"
      style="cursor: crosshair"
    >
      <svg
        id="minimap-svg"
        width="100%"
        height="100%"
        viewBox="0 0 200 90"
        preserveAspectRatio="none"
      >
        <g id="minimap-content"></g>
        <rect
          id="minimap-viewport"
          x="0"
          y="0"
          width="50"
          height="35"
          fill="rgba(55, 125, 255, 0.18)"
          stroke="#377DFF"
          stroke-width="1.5"
          style="pointer-events: none"
        />
      </svg>
    </div>
  </div>
</aside>
